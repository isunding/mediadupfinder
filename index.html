<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重复文件清理助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1420;--card:#1a2133;--card2:#232b42;--border:#2d3650;
  --text:#e4e7ef;--muted:#8b93a7;--accent:#6366f1;--accent2:#818cf8;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;--orange:#f97316;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f35,#0f1420);border-bottom:1px solid var(--border);padding:18px 32px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header h1{font-size:19px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.header .subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.container{max-width:1400px;margin:0 auto;padding:22px}

.file-drop{border:2px dashed var(--border);border-radius:14px;padding:30px;margin-bottom:22px;background:var(--card);text-align:center;transition:all .2s;cursor:pointer}
.file-drop:hover,.file-drop.drag{border-color:var(--accent);background:var(--card2)}
.file-drop .icon{font-size:38px;margin-bottom:10px;opacity:.8}
.file-drop .main{font-size:15px;font-weight:500}
.file-drop .sub{color:var(--muted);font-size:12px;margin-top:5px}
.file-drop input{display:none}

.progress-wrap{max-width:600px;margin:14px auto 0;text-align:left}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .1s}
.progress-text{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.worker-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;margin-left:8px;background:rgba(99,102,241,.15);color:var(--accent2);border:1px solid rgba(99,102,241,.3)}
.worker-tag.stream{background:rgba(234,179,8,.12);color:var(--yellow);border-color:rgba(234,179,8,.35)}

.warn-banner{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.3);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--yellow);display:none;align-items:center;gap:10px}
.warn-banner.show{display:flex}
.warn-banner .btn{margin-left:auto;padding:5px 10px;font-size:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .sub{color:var(--muted);font-size:12px;margin-top:3px}
.stat-card.accent .value{color:var(--accent2)}
.stat-card.green .value{color:var(--green)}
.stat-card.yellow .value{color:var(--yellow)}
.stat-card.red .value{color:var(--red)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:220px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:14px;outline:none}
.search:focus{border-color:var(--accent)}
select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;cursor:pointer}
.btn{padding:8px 15px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);background:var(--card)}
.btn-primary{background:var(--accent);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-check{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--green)}
.btn-ghost{background:transparent}

.load-more{text-align:center;padding:14px;margin:14px 0}

.group{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.group-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:14px;flex-wrap:wrap}
.group-header:hover{background:var(--card2)}
.group-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.group-id{font-family:Consolas,monospace;color:var(--accent2);font-size:13px;font-weight:600}
.group-info{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--border);padding:3px 10px;border-radius:20px;font-size:11px}
.chip.warn{background:rgba(234,179,8,.12);border-color:rgba(234,179,8,.3);color:var(--yellow)}
.chip.safe{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:var(--green)}
.group-body{padding:0 16px 16px;display:none}
.group.open .group-body{display:block}
.group.open .group-header{border-bottom:1px solid var(--border)}
.keep-suggest{background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.25);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:13px;line-height:1.6}
.keep-suggest .label{color:var(--accent2);font-weight:600;margin-right:6px}
.keep-suggest .path{color:var(--muted);word-break:break-all}

.file-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.file-table th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.file-table td{padding:9px;border-bottom:1px solid rgba(45,54,80,.5);vertical-align:top}
.file-table tr:last-child td{border-bottom:none}
.file-table tr.keep-row{background:rgba(34,197,94,.05)}
.file-table tr.marked-del td{background:rgba(239,68,68,.08)}
.file-name{font-weight:600;word-break:break-all}
.file-path{color:var(--muted);font-size:11px;margin-top:3px;word-break:break-all;font-family:Consolas,monospace}
.file-path.clickable{cursor:pointer}
.file-path.clickable:hover{color:var(--accent);text-decoration:underline}
.file-name.clickable{cursor:pointer}
.file-name.clickable:hover{color:var(--accent);text-decoration:underline}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.meta span{white-space:nowrap}
.keep-badge{display:inline-block;background:rgba(34,197,94,.15);color:var(--green);font-size:11px;padding:2px 7px;border-radius:4px;margin-left:4px;font-weight:600}
.marked-badge{display:inline-block;background:rgba(239,68,68,.2);color:var(--red);font-size:11px;padding:2px 7px;border-radius:4px;margin-left:4px;font-weight:600}

.action-bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg),rgba(15,20,32,.95));border-top:1px solid var(--border);padding:12px 22px;backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;z-index:100}
.action-bar .info{color:var(--muted);font-size:13px}
.action-bar .info b{color:var(--red);font-size:17px}
.action-bar .info b.green{color:var(--green)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .icon{font-size:48px;margin-bottom:16px;opacity:.5}
.toggle-arrow{transition:transform .2s;font-size:12px;color:var(--muted);display:inline-block;width:12px}
.group.open .toggle-arrow{transform:rotate(90deg)}
.group-actions{display:flex;gap:8px}

.cat-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:4px}
.cat-badge.strong{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.35)}
.cat-badge.mid{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.35)}
.cat-badge.weak{background:rgba(234,179,8,.15);color:var(--yellow);border:1px solid rgba(234,179,8,.35)}

.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:18px 12px;margin-top:12px;flex-wrap:wrap}
.pagination .pg-info{color:var(--muted);font-size:12px;margin-right:8px}
.pagination .pg-btn{min-width:34px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font-size:13px;font-weight:500}
.pagination .pg-btn:hover:not(:disabled){border-color:var(--accent);background:var(--card)}
.pagination .pg-btn.active{background:var(--accent);border-color:var(--accent)}
.pagination .pg-btn:disabled{opacity:.35;cursor:default}
.pagination .pg-ellipsis{color:var(--muted);font-size:13px;padding:0 4px}

/* R2 缩略图 */
.thumb-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.thumb-toggle input{accent-color:var(--accent);cursor:pointer}
.file-thumb{width:120px;height:68px;object-fit:cover;border-radius:6px;background:var(--card2);border:1px solid var(--border);display:block}
.file-thumb-ph{width:120px;height:68px;border-radius:6px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}

/* R5 导出预览 / R6 对比 模态框 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;max-width:920px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.modal h3{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px}
.modal .modal-body{padding:16px 20px;overflow-y:auto;font-size:13px}
.modal .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal table{width:100%;border-collapse:collapse;font-size:12px}
.modal table th,.modal table td{padding:6px 8px;border-bottom:1px solid rgba(45,54,80,.5);text-align:left;word-break:break-all}
.modal .sum{margin-bottom:12px;color:var(--muted);line-height:1.8}
.modal .sum b{color:var(--red)}

@media(max-width:768px){
  .header{padding:14px}
  .container{padding:14px}
  .stat-card .value{font-size:20px}
  .toolbar .search{min-width:100%}
  .toolbar select,.toolbar .btn{font-size:12px}
  .file-table .col-dur,.file-table .col-res,.file-table .col-br{display:none}
  .action-bar{padding:10px 14px}
  .action-bar .info{width:100%;font-size:12px}
  .file-thumb,.file-thumb-ph{width:84px;height:48px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🗂️ 重复文件清理助手 <span id="fileName" style="font-size:12px;color:var(--muted);font-weight:400"></span></h1>
  <div class="subtitle">拖拽 JSON → Worker 异步解析 → 分批渲染 · 支持超大文件</div>
</div>

<div class="container">

  <div class="file-drop" id="dropZone">
    <div class="icon">📄</div>
    <div class="main">点击选择或拖拽 JSON 文件到这里</div>
    <div class="sub">小文件走 Web Worker · 大文件走流式解析 Worker</div>
    <input type="file" id="fileInput" accept=".json,application/json">
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      <div class="progress-text">
        <span id="progressText">准备中...</span>
        <span id="progressPct">0%</span>
      </div>
    </div>
  </div>

  <div class="warn-banner" id="warnBanner">
    <span id="warnText">⚠️ 已启用流式 Worker 解析</span>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('warnBanner').classList.remove('show')">知道了</button>
  </div>

  <div class="stats" id="stats" style="display:none"></div>

  <div class="toolbar" id="toolbar" style="display:none">
    <input class="search" id="search" placeholder="🔍 搜索文件名或路径...">
    <select id="filterReason"><option value="">全部原因</option></select>
    <select id="filterCat">
      <option value="">全部分类</option>
      <option value="strong">强候选</option>
      <option value="mid">中候选</option>
      <option value="weak">弱候选</option>
    </select>
    <select id="sortBy" title="排序方式">
      <option value="wasted">按浪费空间排序</option>
      <option value="files">按文件数排序</option>
      <option value="avg">按平均浪费排序</option>
    </select>
    <select id="keepStrategy" title="推荐保留策略">
      <option value="res_br_size">分辨率 → 码率 → 大小（默认）</option>
      <option value="size_res_br">大小 → 分辨率 → 码率（大文件优先）</option>
      <option value="br_res_size">码率 → 分辨率 → 大小（高码率优先）</option>
      <option value="res_size_br">分辨率 → 大小 → 码率（画质面积优先）</option>
      <option value="br_size_res">码率 → 大小 → 分辨率</option>
      <option value="size_br_res">大小 → 码率 → 分辨率</option>
    </select>
    <button class="btn btn-sm" onclick="markAllGroups()" title="对全部组执行「除保留外全选」">☑️ 全部组除保留外全选</button>
    <button class="btn btn-sm" onclick="expandAll()">全部展开</button>
    <button class="btn btn-sm" onclick="collapseAll()">全部折叠</button>
    <button class="btn btn-sm btn-danger" onclick="clearAllMarks()">清空标记</button>
    <label class="thumb-toggle" title="用 FFmpeg 抽帧显示缩略图"><input type="checkbox" id="showThumb"> 🖼️ 缩略图</label>
    <button class="btn btn-sm" onclick="diffWithPrevious()" title="与上一次扫描结果对比">🔀 对比上次扫描</button>
    <button class="btn btn-sm" onclick="saveBookmark()" title="把当前结果存为书签">⭐ 存为书签</button>
    <select id="bookmarkSel" title="打开已存书签" style="display:none"><option value="">📑 书签…</option></select>
  </div>

  <div id="groups"></div>
  <div class="pagination" id="pagination" style="display:none"></div>

</div>

<div class="action-bar" id="actionBar" style="display:none">
  <div class="info">已标记 <b id="markedCount">0</b> 个文件 · 可释放 <b class="green" id="markedSize">0</b></div>
  <div style="display:flex;gap:10px">
    <button class="btn btn-sm" onclick="exportList('txt')">导出 TXT</button>
    <button class="btn btn-sm" onclick="exportList('csv')">导出 CSV</button>
    <button class="btn btn-sm btn-primary" onclick="exportList('json')">导出 JSON</button>
    <button class="btn btn-sm" onclick="exportOpenScript('py')">🐍 生成 Open .py</button>
    <button class="btn btn-sm" onclick="exportOpenScript('bat')">🪟 .bat</button>
    <button class="btn btn-sm" onclick="exportOpenScript('sh')">🍎 .sh</button>
  </div>
</div>

<script>
const MB = 1024**2, GB = 1024**3, KB = 1024;
const WORKER_JSON_THRESHOLD = 200 * MB;
const PAGE_SIZE = 50;

let groups = [], filteredGroups = [], marked = new Set(), EXPANDED = new Set();
let currentPage = 1;
let CURRENT = { taskId: '', name: '', path: '' };   // 当前结果标识（书签 / 对比用）

function fmtSize(b){
  if(b>=GB) return (b/GB).toFixed(2)+' GB';
  if(b>=MB) return (b/MB).toFixed(2)+' MB';
  if(b>=KB) return (b/KB).toFixed(2)+' KB';
  return b+' B';
}
function fmtDuration(s){
  s = Math.round(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${m}:${String(ss).padStart(2,'0')}`;
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', ()=>fileInput.click());
dropZone.addEventListener('dragover', e=>{e.preventDefault();dropZone.classList.add('drag')});
dropZone.addEventListener('dragleave', ()=>dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e=>{
  e.preventDefault();dropZone.classList.remove('drag');
  if(e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e=>{ if(e.target.files[0]) pickFile(e.target.files[0]); });

function setProgress(percent, text){
  document.getElementById('progressFill').style.width = percent+'%';
  document.getElementById('progressText').textContent = text || '';
  document.getElementById('progressPct').textContent = percent+'%';
}
function showProgress(){ document.getElementById('progressWrap').style.display='block'; }
function hideProgress(){ document.getElementById('progressWrap').style.display='none'; }

function pickFile(file){
  CURRENT = { taskId: '', name: file.name, path: '' };
  document.getElementById('fileName').textContent = '· '+file.name+' ('+fmtSize(file.size)+')';
  showProgress();
  setProgress(0, '初始化...');

  const workerType = file.size >= WORKER_JSON_THRESHOLD ? 'stream' : 'json';
  const workerFile = workerType === 'stream' ? 'worker-stream.js' : 'worker-json.js';
  const workerTag = workerType === 'stream'
    ? '<span class="worker-tag stream">⚡ 流式 Worker</span>'
    : '<span class="worker-tag">🧵 JSON Worker</span>';

  setProgress(2, '启动 '+workerTag+'...');

  let worker;
  try {
    worker = new Worker(workerFile);
  } catch(err) {
    setProgress(0, 'Worker 创建失败，回退主线程...');
    setTimeout(()=>fallbackMainThread(file), 300);
    return;
  }

  let done = false;
  let gotFirstMsg = false;

  const startupTimeout = setTimeout(()=>{
    if(!gotFirstMsg && !done){
      worker.terminate();
      setProgress(0, 'Worker 无响应（可能 file:// 协议限制），回退主线程解析...');
      setTimeout(()=>fallbackMainThread(file), 500);
    }
  }, 5000);

  const hardTimeout = setTimeout(()=>{
    if(!done){
      worker.terminate();
      setProgress(0, 'Worker 超时，回退主线程解析...');
      setTimeout(()=>fallbackMainThread(file), 500);
    }
  }, 120000);

  worker.onmessage = (e)=>{
    if(!gotFirstMsg){ gotFirstMsg = true; clearTimeout(startupTimeout); }
    const msg = e.data;
    if(msg.type === 'progress'){
      setProgress(msg.percent, msg.text);
    } else if(msg.type === 'result'){
      done = true; clearTimeout(hardTimeout); worker.terminate();
      handleParsed(msg.data, file, workerType);
    } else if(msg.type === 'error'){
      done = true; clearTimeout(hardTimeout); worker.terminate();
      hideProgress();
      alert('Worker 解析失败：'+msg.message);
      resetUI();
    }
  };
  worker.onerror = (e)=>{
    done = true; clearTimeout(startupTimeout); clearTimeout(hardTimeout); worker.terminate();
    setProgress(0, 'Worker 错误，回退主线程解析...');
    setTimeout(()=>fallbackMainThread(file), 500);
  };

  worker.postMessage({ file, size: file.size });
}

async function fallbackMainThread(file){
  try{
    setProgress(10, '主线程读取中...');
    const text = await file.text();
    setProgress(50, '主线程 JSON.parse（可能短暂卡顿）...');
    await new Promise(r=>setTimeout(r,10));
    const data = JSON.parse(text);
    setProgress(90, '处理中...');
    await new Promise(r=>setTimeout(r,10));
    handleParsed(data, file, 'main');
  }catch(err){
    hideProgress();
    alert('解析失败：'+err.message);
    resetUI();
  }
}

function handleParsed(data, file, workerType){
  const merged = [];
  const catMap = {strong_candidates:'strong', mid_candidates:'mid', weak_candidates:'weak'};
  for(const [key, cat] of Object.entries(catMap)){
    const arr = data[key];
    if(Array.isArray(arr)){
      for(const g of arr){ g.cat = cat; merged.push(g); }
    }
  }
  groups = merged;

  const banner = document.getElementById('warnBanner');
  banner.classList.remove('show');
  if(workerType === 'stream'){
    document.getElementById('warnText').textContent =
      `⚡ 使用流式 Worker 解析 ${fmtSize(file.size)}，共 ${groups.length.toLocaleString()} 组 · 分批渲染保持流畅`;
    banner.classList.add('show');
  } else if(file.size >= 50*MB){
    document.getElementById('warnText').textContent =
      `🧵 使用 Worker 解析 ${fmtSize(file.size)}，共 ${groups.length.toLocaleString()} 组`;
    banner.classList.add('show');
  }

  hideProgress();
  document.getElementById('dropZone').style.display = 'none';
  recalcSuggested();
  groups.forEach(g=>EXPANDED.add(g.group_id));
  initUI();
  renderAll();
  renderBookmarkBar();
}

function resetUI(){
  document.getElementById('fileName').textContent='';
  document.getElementById('dropZone').style.display='block';
  document.getElementById('stats').style.display='none';
  document.getElementById('toolbar').style.display='none';
  document.getElementById('groups').innerHTML='';
  document.getElementById('pagination').style.display='none';
  document.getElementById('actionBar').style.display='none';
  hideProgress();
  groups=[]; filteredGroups=[]; marked.clear(); EXPANDED.clear(); currentPage=1;
}

function initUI(){
  const sel = document.getElementById('filterReason');
  sel.innerHTML = '<option value="">全部原因</option>';
  [...new Set(groups.map(g=>g.reason))].forEach(r=>{
    const o = document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o);
  });
  sel.onchange = renderGroups;
  document.getElementById('filterCat').onchange = renderGroups;
  document.getElementById('keepStrategy').onchange = ()=>{ recalcSuggested(); renderAll(); };
  document.getElementById('sortBy').onchange = ()=>{ currentPage=1; renderGroups(); };
  document.getElementById('showThumb').onchange = ()=>{ renderGroups(); };
  document.getElementById('bookmarkSel').onchange = (e)=>{ if(e.target.value) openBookmark(e.target.value); };
  document.getElementById('stats').style.display = 'grid';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('stats').innerHTML = buildStats();
  document.getElementById('search').oninput = ()=>{ currentPage=1; renderGroups(); };
}

const KEEP_STRATEGIES = {
  res_br_size: f => [f.width*f.height, f.video_bitrate+f.audio_bitrate, f.size],
  size_res_br: f => [f.size, f.width*f.height, f.video_bitrate+f.audio_bitrate],
  br_res_size: f => [f.video_bitrate+f.audio_bitrate, f.width*f.height, f.size],
  res_size_br: f => [f.width*f.height, f.size, f.video_bitrate+f.audio_bitrate],
  br_size_res: f => [f.video_bitrate+f.audio_bitrate, f.size, f.width*f.height],
  size_br_res: f => [f.size, f.video_bitrate+f.audio_bitrate, f.width*f.height],
};

function recalcSuggested(){
  const strat = document.getElementById('keepStrategy').value;
  const scoreFn = KEEP_STRATEGIES[strat] || KEEP_STRATEGIES.res_br_size;
  for(const g of groups){
    if(!g.files || !g.files.length){ g.suggested_keep = ''; continue; }
    let best = g.files[0], bestKey = scoreFn(best);
    for(let i=1;i<g.files.length;i++){
      const f = g.files[i], k = scoreFn(f);
      if(k[0]>bestKey[0] || (k[0]===bestKey[0] && k[1]>bestKey[1]) ||
         (k[0]===bestKey[0] && k[1]===bestKey[1] && k[2]>bestKey[2])){
        best=f; bestKey=k;
      }
    }
    g.suggested_keep = best.path;
  }
}

function buildStats(){
  const totalFiles = groups.reduce((s,g)=>s+g.files.length,0);
  const totalWasted = groups.reduce((s,g)=>s+g.wasted_bytes,0);
  const maxG = groups.reduce((m,g)=>!m||g.wasted_bytes>m.wasted_bytes?g:m,null);
  const avg = groups.length ? totalWasted/groups.length : 0;
  const sc = groups.filter(g=>g.cat==='strong').length;
  const mc = groups.filter(g=>g.cat==='mid').length;
  const wc = groups.filter(g=>g.cat==='weak').length;
  return `
    <div class="stat-card accent"><div class="label">重复分组</div><div class="value">${groups.length.toLocaleString()}</div><div class="sub">强 ${sc} · 中 ${mc} · 弱 ${wc} · 共 ${totalFiles.toLocaleString()} 个文件</div></div>
    <div class="stat-card red"><div class="label">可释放空间</div><div class="value">${fmtSize(totalWasted)}</div><div class="sub">理论最大节省</div></div>
    <div class="stat-card yellow"><div class="label">平均浪费 / 组</div><div class="value">${fmtSize(avg)}</div></div>
    <div class="stat-card green"><div class="label">最大浪费组</div><div class="value" style="font-size:15px">${maxG?maxG.group_id:'-'}</div><div class="sub">${maxG?fmtSize(maxG.wasted_bytes):''}</div></div>
  `;
}

function sortGroups(arr){
  const mode = document.getElementById('sortBy') ? document.getElementById('sortBy').value : 'wasted';
  const sorted = arr.slice();
  if(mode === 'files'){
    sorted.sort((a,b)=> (b.file_count||b.files.length) - (a.file_count||a.files.length) ||
                        b.wasted_bytes - a.wasted_bytes);
  }else if(mode === 'avg'){
    const avg = g => g.files.length ? g.wasted_bytes / g.files.length : 0;
    sorted.sort((a,b)=> avg(b) - avg(a));
  }else{
    sorted.sort((a,b)=> b.wasted_bytes - a.wasted_bytes);
  }
  return sorted;
}

function renderAll(){
  const kw = (document.getElementById('search').value||'').toLowerCase().trim();
  const reasonFilter = document.getElementById('filterReason').value;
  const catFilter = document.getElementById('filterCat').value;
  filteredGroups = sortGroups(groups.filter(g=>{
    if(catFilter && g.cat !== catFilter) return false;
    if(reasonFilter && g.reason !== reasonFilter) return false;
    if(kw){
      const hay = g.files.map(f=>f.name+' '+f.path).join(' ').toLowerCase();
      if(!hay.includes(kw) && !g.group_id.toLowerCase().includes(kw)) return false;
    }
    return true;
  }));

  const container = document.getElementById('groups');
  const pgEl = document.getElementById('pagination');
  if(filteredGroups.length===0){
    container.innerHTML = `<div class="empty"><div class="icon">📭</div>没有匹配的结果</div>`;
    pgEl.style.display='none';
    updateActionBar(); return;
  }

  const totalPages = Math.max(1, Math.ceil(filteredGroups.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;

  const start = (currentPage - 1) * PAGE_SIZE;
  const slice = filteredGroups.slice(start, start + PAGE_SIZE);

  let html = '';
  for(const g of slice) html += groupHTML(g);
  container.innerHTML = html;
  initThumbs();

  renderPagination(totalPages);
  updateActionBar();
}

function renderPagination(totalPages){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.style.display='none'; return; }
  el.style.display='flex';

  const totalItems = filteredGroups.length;
  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(start + PAGE_SIZE - 1, totalItems);

  let html = `<span class="pg-info">显示 ${start.toLocaleString()}-${end.toLocaleString()} / ${totalItems.toLocaleString()} 组 · 共 ${totalPages} 页</span>`;

  html += `<button class="pg-btn" ${currentPage===1?'disabled':''} onclick="gotoPage(${currentPage-1})">‹ 上一页</button>`;

  const showSet = new Set([1, totalPages]);
  for(let p = currentPage - 2; p <= currentPage + 2; p++){
    if(p >= 1 && p <= totalPages) showSet.add(p);
  }
  const pages = [...showSet].sort((a,b)=>a-b);

  let prev = 0;
  for(const p of pages){
    if(p - prev > 1) html += `<span class="pg-ellipsis">…</span>`;
    html += `<button class="pg-btn ${p===currentPage?'active':''}" onclick="gotoPage(${p})">${p}</button>`;
    prev = p;
  }

  html += `<button class="pg-btn" ${currentPage===totalPages?'disabled':''} onclick="gotoPage(${currentPage+1})">下一页 ›</button>`;

  el.innerHTML = html;
}

function gotoPage(p){
  currentPage = p;
  renderAll();
}

/* R2：缩略图懒加载（进入视口才请求 FFmpeg 抽帧） */
let _thumbObserver = null;
function initThumbs(){
  if(!document.getElementById('showThumb') || !document.getElementById('showThumb').checked) return;
  const nodes = document.querySelectorAll('[data-thumb-for]');
  if(!nodes.length) return;
  if(!('IntersectionObserver' in window)){
    nodes.forEach(n=>loadThumb(n));
    return;
  }
  if(_thumbObserver) _thumbObserver.disconnect();
  _thumbObserver = new IntersectionObserver((entries, obs)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){ loadThumb(en.target); obs.unobserve(en.target); }
    });
  }, {rootMargin:'200px'});
  nodes.forEach(n=>_thumbObserver.observe(n));
}
function loadThumb(node){
  const p = decodeURIComponent(node.dataset.thumbFor);
  delete node.dataset.thumbFor;
  const img = document.createElement('img');
  img.className = 'file-thumb';
  img.loading = 'lazy';
  img.alt = '';
  img.src = '/api/thumb?path=' + encodeURIComponent(p);
  img.onerror = ()=>{ img.replaceWith(node); };
  node.replaceWith(img);
}

document.getElementById('groups').addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(action==='toggle-group'){
    const el = e.target.closest('.group');
    const gid = el.dataset.gid;
    el.classList.toggle('open');
    if(el.classList.contains('open')) EXPANDED.add(gid); else EXPANDED.delete(gid);
  }else if(action==='toggle'){
    const p = decodeURIComponent(btn.dataset.path);
    const willDelete = !marked.has(p);
    if(willDelete) marked.add(p); else marked.delete(p);
    const grp = groups.find(g=>g.files.some(f=>f.path===p));
    if(grp && willDelete && p===grp.suggested_keep){
      const remain = grp.files.filter(f=>!marked.has(f.path));
      if(remain.length>0){
        const scoreFn = KEEP_STRATEGIES[document.getElementById('keepStrategy').value] || KEEP_STRATEGIES.res_br_size;
        let best=remain[0], bk=scoreFn(best);
        for(let i=1;i<remain.length;i++){
          const k=scoreFn(remain[i]);
          if(k[0]>bk[0]||(k[0]===bk[0]&&k[1]>bk[1])||(k[0]===bk[0]&&k[1]===bk[1]&&k[2]>bk[2])){best=remain[i];bk=k;}
        }
        grp.suggested_keep = best.path;
      }else{
        grp.suggested_keep = '';
      }
    }
    renderGroups();
  }else if(action==='mark-all'){
    const gid = btn.dataset.gid;
    const g = groups.find(x=>x.group_id===gid);
    if(g) g.files.forEach(f=>{ if(f.path !== g.suggested_keep) marked.add(f.path); });
    renderGroups();
  }else if(action==='open-file'){
    const p = decodeURIComponent(btn.dataset.path);
    fetch('/api/open', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path: p, reveal: true})})
      .then(r=>r.json()).then(res=>{
        if(!res.ok) showToast('打开失败：'+(res.error||'未知错误'));
      }).catch(()=>showToast('打开失败（离线页面不支持）'));
  }else if(action==='copy-file' || action==='copy-folder'){
    const p = decodeURIComponent(btn.dataset.path);
    const target = action==='copy-folder'
      ? p.replace(/[\\\/][^\\\/]+$/, '')
      : p;
    navigator.clipboard.writeText(target).then(()=>{
      showToast(action==='copy-folder' ? '已复制文件夹路径' : '已复制文件路径');
    }).catch(()=>{
      const ta = document.createElement('textarea'); ta.value=target; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast(action==='copy-folder' ? '已复制文件夹路径' : '已复制文件路径');
    });
  }
});

let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast';
    Object.assign(t.style,{position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%)',
      background:'rgba(0,0,0,.82)',color:'#fff',padding:'8px 16px',borderRadius:'6px',
      fontSize:'13px',zIndex:'9999',pointerEvents:'none',transition:'opacity .2s'});
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.opacity='0'; }, 1500);
}

function collapseAll(){ document.querySelectorAll('.group').forEach(g=>{g.classList.remove('open');EXPANDED.delete(g.dataset.gid)}); }
function clearAllMarks(){ marked.clear(); renderGroups(); }
/* R1：对全部组批量执行「除保留外全选」 */
function markAllGroups(){
  if(!groups.length) return;
  let added = 0;
  groups.forEach(g=>{
    g.files.forEach(f=>{
      if(f.path !== g.suggested_keep && !marked.has(f.path)){ marked.add(f.path); added++; }
    });
  });
  renderGroups();
  showToast(`已标记 ${added.toLocaleString()} 个文件（保留每组建议保留项）`);
}
function renderGroups(){ renderAll(); }

function updateActionBar(){
  const bar = document.getElementById('actionBar');
  if(marked.size===0){ bar.style.display='none'; return; }
  bar.style.display='flex';
  let bytes = 0;
  groups.forEach(g=>{ g.files.forEach(f=>{ if(marked.has(f.path)) bytes += f.size; }); });
  document.getElementById('markedCount').textContent = marked.size.toLocaleString();
  document.getElementById('markedSize').textContent = fmtSize(bytes);
}

function getMarkedFiles(){
  const seen = new Set();
  const r = [];
  groups.forEach(g=>{ g.files.forEach(f=>{
    if(marked.has(f.path) && !seen.has(f.path)){
      seen.add(f.path);
      r.push({group_id:g.group_id,...f});
    }
  }); });
  return r;
}

function doExportOpenScript(os){
  const list = getMarkedFiles();
  if(list.length===0){ alert('还没有标记任何文件'); return; }
  let content='', ext='', mime='';
  const paths = list.map(f=>f.path);
  const stamp = new Date().toLocaleString('sv-SE', {hour12:false}).replace(/[: ]/g,'-');

  if(os==='py'){
    ext='py'; mime='text/plain;charset=utf-8';
    const header = `# -*- coding: utf-8 -*-
"""双击运行，在资源管理器中定位以下 ${list.length} 个文件。
已标记删除：共 ${list.length} 个，可释放空间 ${(list.reduce((s,f)=>s+f.size,0)/1024/1024/1024).toFixed(2)} GB
"""
import os, sys, subprocess

def open_in_explorer(path):
    path = os.path.abspath(path)
    if not os.path.exists(path):
        print(f"  [不存在] {path}")
        return
    try:
        if sys.platform == 'win32':
            subprocess.Popen(['explorer', '/select,', path])
        elif sys.platform == 'darwin':
            subprocess.Popen(['open', '-R', path])
        else:
            subprocess.Popen(['xdg-open', os.path.dirname(path)])
    except Exception as e:
        print(f"  [失败] {path}: {e}")

files = ${JSON.stringify(paths, null, 2)}

print(f"共 {len(files)} 个文件，逐个定位中...\\n")
for i, p in enumerate(files, 1):
    print(f"  [{i}/{len(files)}] {p}")
    open_in_explorer(p)

print(f"\\n完成。如需删除这些文件，请手动确认后操作。")
input("按回车退出...")
`;
    content = header;
  }else if(os==='bat'){
    ext='bat'; mime='text/plain;charset=utf-8';
    const lines = ['@echo off', 'chcp 65001 >nul', 'REM ===============================================',
      'REM 逐个打开资源管理器并定位文件',
      'REM ===============================================', '',
      ...paths.map(p=>{
        const pp = p.replace(/\//g,'\\');
        return `echo 正在定位: ${pp}\nexplorer /select,"${pp}"`;
      }), '', 'echo.', 'echo 全部完成', 'pause'];
    content = lines.join('\r\n');
  }else{
    ext='sh'; mime='text/plain;charset=utf-8';
    const lines = ['#!/bin/bash', '# ===============================================',
      '# 打开并定位以下文件（运行: bash open_marked.sh）',
      '# ===============================================', '',
      ...paths.map(p=>{
        const escaped = p.replace(/"/g,'\\"');
        return `echo "正在定位: ${escaped}"\nopen -R "${escaped}" 2>/dev/null || open -a Finder "${escaped}" 2>/dev/null || echo "  (Finder 不可用: ${escaped})"`;
      }), '', 'echo', 'echo "全部定位完成"'];
    content = lines.join('\n');
  }

  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `open_marked_${stamp}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已生成 .${ext}（${list.length} 个文件）${os==='py'?' · 双击或 python 运行即可':''}`);
}

     ${more}<table><thead><tr><th>#</th><th>文件</th><th>路径</th><th>大小</th></tr></thead><tbody>${rows}</tbody></table>`,
    `<button class="btn" onclick="closeModal()">取消</button>
     <button class="btn btn-primary" onclick="closeModal();doExportList('${format}')">确认并下载 ${name}</button>`);
}

function doExportList(format){
  const list = getMarkedFiles();
  if(list.length===0){ alert('还没有标记任何文件'); return; }
  let content='', mime='', ext='';
  if(format==='txt'){
    content = list.map((f,i)=>`#${i+1}  [${f.group_id}]  ${f.name}\n${f.path}\n# ${fmtSize(f.size)}  ${fmtDuration(f.duration)}  ${f.resolution}\n`).join('\n');
    mime='text/plain'; ext='txt';
  }else if(format==='csv'){
    const header='group_id,name,path,size_bytes,size_mb,duration,resolution,video_bitrate,audio_bitrate,format';
    const esc = v=>`"${String(v).replace(/"/g,'""')}"`;
    content = header+'\n'+list.map(f=>[f.group_id,f.name,f.path,f.size,f.size_mb,f.duration,f.resolution,f.video_bitrate,f.audio_bitrate,f.format].map(esc).join(',')).join('\n');
    mime='text/csv'; ext='csv';
  }else{
    content = JSON.stringify(list,null,2);
    mime='application/json'; ext='json';
  }
  const blob = new Blob([content],{type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `delete_list_${new Date().toLocaleString('sv-SE', {hour12:false}).replace(/[: ]/g,'-')}.${ext}`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= R6 跨扫描对比 ================= */
function groupSignature(g){
  return (g.files || []).map(f=>f.path).sort().join('\n');
}
function mergeCandidates(data){
  const merged = [];
  const catMap = {strong_candidates:'strong', mid_candidates:'mid', weak_candidates:'weak'};
  for(const [key, cat] of Object.entries(catMap)){
    const arr = data[key];
    if(Array.isArray(arr)) for(const g of arr){ g.cat = cat; merged.push(g); }
  }
  return merged;
}
function loadResultByTask(taskId){
  return fetch('/api/history/' + encodeURIComponent(taskId) + '/result')
    .then(r=>r.json()).then(res=>{
      if(!res.ok) throw new Error(res.error || '加载失败');
      return { data: res.data, item: res.item || {} };
    });
}
function diffWithPrevious(){
  if(!groups.length){ alert('请先加载扫描结果'); return; }
  fetch('/api/history').then(r=>r.json()).then(h=>{
    const items = (h.items || []).filter(it=>it.available && it.task_id !== CURRENT.taskId);
    if(!items.length){ alert('没有可对比的历史结果（需要至少两次扫描）'); return; }
    const prev = items[0];
    return loadResultByTask(prev.task_id).then(({data, item})=>{
      const prevGroups = mergeCandidates(data);
      const prevSig = new Set(prevGroups.map(groupSignature));
      const curSig = new Set(groups.map(groupSignature));
      const newGroups = groups.filter(g=>!prevSig.has(groupSignature(g)));
      const goneGroups = prevGroups.filter(g=>!curSig.has(groupSignature(g)));
      renderDiffModal(prev, item, newGroups, goneGroups);
    });
  }).catch(err=>alert('对比失败：'+err.message));
}
function renderDiffModal(prev, item, newGroups, goneGroups){
  const newWasted = newGroups.reduce((s,g)=>s+(g.wasted_bytes||0),0);
  const newRows = newGroups.slice(0,200).map((g,i)=>
    `<tr><td>${i+1}</td><td>${esc(g.group_id)}</td><td>${esc(g.reason||'')}</td><td>${g.files.length}</td><td>${fmtSize(g.wasted_bytes)}</td><td>${esc(g.files[0]?g.files[0].name:'')}</td></tr>`).join('');
  const goneRows = goneGroups.slice(0,100).map(g=>
    `<tr><td>${esc(g.group_id)}</td><td>${esc(g.reason||'')}</td><td>${fmtSize(g.wasted_bytes)}</td></tr>`).join('');
  showModal(`🔀 跨扫描对比 · 本次 vs ${esc(String(prev.start_time||'').replace('T',' '))}`,
    `<div class="sum">
       对比基准任务：${esc(prev.task_id)}<br>
       本次<b>新增重复组 ${newGroups.length.toLocaleString()}</b> 组，新增可释放 <b>${fmtSize(newWasted)}</b><br>
       上次有、本次已消失：${goneGroups.length.toLocaleString()} 组
     </div>
     <h4 style="margin:10px 0 6px">🆕 新增重复组${newGroups.length>200?'（仅列前 200 条）':''}</h4>
     ${newGroups.length?`<table><thead><tr><th>#</th><th>分组</th><th>原因</th><th>文件数</th><th>浪费</th><th>示例文件</th></tr></thead><tbody>${newRows}</tbody></table>`
       :'<div class="sum">没有新增重复组。</div>'}
     ${goneGroups.length?`<h4 style="margin:14px 0 6px">✅ 已消失的组${goneGroups.length>100?'（仅列前 100 条）':''}</h4>
       <table><thead><tr><th>分组</th><th>原因</th><th>浪费</th></tr></thead><tbody>${goneRows}</tbody></table>`:''}`,
    `<button class="btn" onclick="closeModal()">关闭</button>`);
}

/* ================= Q2 结果书签 ================= */
const BOOKMARK_KEY = 'mdf_bookmarks_v1';
function loadBookmarks(){ try{ return JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '[]'); }catch(e){ return []; } }
function saveBookmarks(list){ localStorage.setItem(BOOKMARK_KEY, JSON.stringify(list)); }
function saveBookmark(){
  if(!groups.length){ alert('请先加载扫描结果'); return; }
  const key = CURRENT.taskId || CURRENT.path || CURRENT.name;
  if(!key){ alert('当前结果没有可复用的标识，无法存为书签'); return; }
  const label = prompt('书签名称：', CURRENT.name || CURRENT.taskId || '扫描结果');
  if(!label) return;
  const entry = { key, label, taskId: CURRENT.taskId, path: CURRENT.path, name: CURRENT.name,
                  groups: groups.length,
                  time: new Date().toLocaleString('sv-SE', {hour12:false}) };
  const list = loadBookmarks();
  const idx = list.findIndex(b=>b.key===key);
  if(idx >= 0) list[idx] = entry; else list.unshift(entry);
  saveBookmarks(list.slice(0, 50));
  renderBookmarkBar();
  showToast('已存为书签');
}
function renderBookmarkBar(){
  const sel = document.getElementById('bookmarkSel');
  if(!sel) return;
  const list = loadBookmarks();
  sel.style.display = list.length ? 'inline-block' : 'none';
  sel.innerHTML = '<option value="">📑 书签…</option>'
    + list.map(b=>`<option value="${esc(b.key)}">${esc(b.label)}（${b.groups} 组）</option>`).join('');
}
function openBookmark(key){
  const b = loadBookmarks().find(x=>x.key === key);
  if(!b) return;
  if(b.taskId) loadResultByTask(b.taskId).then(({data, item})=>{
    applyResultData(data, item.result_name || b.name, item.result_path || b.path, b.taskId);
  }).catch(err=>alert('打开书签失败：'+err.message));
  else if(b.path) loadFromApi(b.path);
  else alert('该书签缺少可重新加载的标识');
}

/* ================= 结果加载 ================= */
function loadFromApi(path){
  const url = '/api/result' + (path ? '?path=' + encodeURIComponent(path) : '');
  fetch(url).then(r=>r.json()).then(res=>{
    if(res.ok && res.data) applyResultData(res.data, res.name, res.path, res.task_id);
    else renderBookmarkBar();
  }).catch(()=>renderBookmarkBar());
}
function applyResultData(data, name, path, taskId){
  CURRENT = { taskId: taskId || '', name: name || '', path: path || '' };
  const fakeFile = { size: JSON.stringify(data).length, name: name || 'dup_result.json' };
  handleParsed(data, fakeFile, 'api');
  document.getElementById('fileName').textContent = '· 已从后端加载结果' + (name ? ' · '+name : '');
}

(function initResultPage(){
  if(window.location.protocol === 'file:'){ renderBookmarkBar(); return; }
  const qs = new URLSearchParams(window.location.search);
  const taskId = qs.get('task');
  const resultPath = qs.get('path');
  if(taskId){
    loadResultByTask(taskId).then(({data, item})=>
      applyResultData(data, item.result_name, item.result_path, taskId)
    ).catch(err=>{ alert('加载历史结果失败：'+err.message); loadFromApi(); });
    return;
  }
  loadFromApi(resultPath);
})();
</script>
